name: Keep Supabase Alive

on:
  schedule:
    # 毎日午前9時（UTC）に実行 = 日本時間午後6時
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
    - name: Health Check
      run: |
        curl -X GET "${{ secrets.APP_URL }}/api/health-check" \
          -H "Content-Type: application/json" \
          --fail --silent --show-error
        
    - name: Keep Alive Ping
      run: |
        curl -X POST "${{ secrets.APP_URL }}/api/keep-alive" \
          -H "Content-Type: application/json" \
          --fail --silent --show-error
          
    - name: Log Success
      run: echo "Supabase keep-alive successful at $(date)"